name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: pytest tests/unit/
    
    - name: Set up Redis for integration tests
      uses: shogo82148/actions-setup-redis@v1
      with:
        redis-version: '7.0'
    
    - name: Run integration tests
      run: pytest tests/integration/
    
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Lint with flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Check formatting with black
      run: black --check .
  
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push MCP server
      uses: docker/build-push-action@v4
      with:
        context: ./mcp-server
        push: ${{ github.event_name != 'pull_request' }}
        tags: mcp/server:latest,mcp/server:${{ github.sha }}
    
    - name: Build and push Coordinator agent
      uses: docker/build-push-action@v4
      with:
        context: ./agents/coordinator
        push: ${{ github.event_name != 'pull_request' }}
        tags: mcp/coordinator-agent:latest,mcp/coordinator-agent:${{ github.sha }}
    
    - name: Build and push Aesthetic agent
      uses: docker/build-push-action@v4
      with:
        context: ./agents/aesthetic
        push: ${{ github.event_name != 'pull_request' }}
        tags: mcp/aesthetic-agent:latest,mcp/aesthetic-agent:${{ github.sha }}
    
    - name: Build and push UX Flow agent
      uses: docker/build-push-action@v4
      with:
        context: ./agents/ux-flow
        push: ${{ github.event_name != 'pull_request' }}
        tags: mcp/ux-flow-agent:latest,mcp/ux-flow-agent:${{ github.sha }}
    
    - name: Build and push Accessibility agent
      uses: docker/build-push-action@v4
      with:
        context: ./agents/accessibility
        push: ${{ github.event_name != 'pull_request' }}
        tags: mcp/accessibility-agent:latest,mcp/accessibility-agent:${{ github.sha }}
    
    - name: Build and push Persona agent
      uses: docker/build-push-action@v4
      with:
        context: ./agents/persona
        push: ${{ github.event_name != 'pull_request' }}
        tags: mcp/persona-agent:latest,mcp/persona-agent:${{ github.sha }}
    
    - name: Build and push UI
      uses: docker/build-push-action@v4
      with:
        context: ./ui
        push: ${{ github.event_name != 'pull_request' }}
        tags: mcp/ui:latest,mcp/ui:${{ github.sha }}