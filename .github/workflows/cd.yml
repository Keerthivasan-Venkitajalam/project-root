name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main, develop]
    types: [completed]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.25.0'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
    
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name staging-cluster --region us-west-2
    
    - name: Deploy to staging
      run: |
        cd k8s/staging
        kubectl apply -f namespace.yaml
        kubectl apply -f redis.yaml
        kubectl apply -f solana.yaml
        kubectl apply -f mcp-server.yaml
        kubectl apply -f agents.yaml
        kubectl apply -f ui.yaml
        kubectl apply -f monitoring.yaml
    
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/mcp-server -n mcp-staging
        kubectl rollout status deployment/coordinator-agent -n mcp-staging
        kubectl rollout status deployment/ui -n mcp-staging
    
  deploy-production:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    
    environment:
      name: production
      url: https://mcp.example.com
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.25.0'
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
    
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name production-cluster --region us-west-2
    
    - name: Deploy to production
      run: |
        cd k8s/production
        kubectl apply -f namespace.yaml
        kubectl apply -f redis.yaml
        kubectl apply -f solana.yaml
        kubectl apply -f mcp-server.yaml
        kubectl apply -f agents.yaml
        kubectl apply -f ui.yaml
        kubectl apply -f monitoring.yaml
    
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/mcp-server -n mcp-production
        kubectl rollout status deployment/coordinator-agent -n mcp-production
        kubectl rollout status deployment/ui -n mcp-production
    
    - name: Send notification
      uses: slackapi/slack-github-action@v1.23.0
      with:
        payload: |
          {
            "text": "New deployment to production completed successfully! 🚀",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "New deployment to *production* completed successfully! 🚀\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "View deployment: https://mcp.example.com"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK